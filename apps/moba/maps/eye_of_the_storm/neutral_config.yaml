# Neutral (jungle) camps for Eye of the Storm. Camps own placement + respawn +
# aggro/leash ranges; mobs own stats/display/drops. A `members` entry references
# a mob `key`; `pos` is [x, y, z, orientation]. A mob placed in no camp is
# skipped. Ranges/lockfile rules: apps/moba/README.md.
#
#   units                          reusable definitions of what a mob IS. A mob
#                                  names one with `unit:` and may override any
#                                  field it sets -- wholesale per field, never
#                                  merged (a row restating `drops` replaces the
#                                  list; `drops: []` means none). A unit may not
#                                  set `key`.
#   respawn_ms / initial_spawn_ms  milliseconds
#   aggro_range / leash_range      yards
#   *_modifier                     multiplier on the source creature's stat
#   creature_type                  optional; overrides source type (enum
#                                  CreatureType). The jungle sources are
#                                  Humanoid (7), so Beast (1) is explicit.
#   drops[].type                   buff | gold | item

