# Structures for Eye of the Storm: towers, inhibitors, and the base (core).
# gen_tower_data.py turns this into data/sql/custom/db_world/mod_moba_towers.sql --
# both the shared structure creatures (creature_template + creature_template_model)
# AND their per-map placement (mod_moba_tower_data). There is no hand-written
# defs file: everything a designer tunes lives here.
#
#   team                0 = Alliance, 1 = Horde (also picks faction 84/83)
#   kind                tower | inhibitor | core   (default tower)
#                         tower     -- attacks; unlocks what it guards on death
#                         inhibitor -- passive; on death gives the enemy super
#                                      minions and respawns after respawn_ms
#                         core      -- the base; destroying it wins the match
#   gold                copper to EVERY player on the destroying team (flat per
#                       player, not a split pot); 0 = none
#   gold_last_hit       copper to the killing-blow player only, on top of the
#                       above. A structure finished by a creep pays its team but
#                       no bonus, so this is silently skipped there. 0 = none
#   key                 stable name for this structure; entries are assigned by
#                       the generator into tower_config.lock.json, never here
#   guarded_by          omit = always vulnerable; else the KEY that must die first
#   respawn_ms          inhibitor respawn delay (ms); omit / 0 = never respawns
#   name                creature name (subname defaults to "MOBA Objective")
#   display_id          creature model; display_scale multiplies its size
#   health_modifier     x the level-80 baseline HP (armor_modifier optional, def 5)
#   attack_range        yards            (inert for passive kinds)
#   attack_interval_ms  ms between shots  (inert for passive kinds)
#   attack_spell_id     projectile spell  (0 / inert for passive kinds)
#
# Kill order per side: tower -> inhibitor -> base. Positions are .gps-captured
# in-game; temporary until the mid-lane layout is finalized.

