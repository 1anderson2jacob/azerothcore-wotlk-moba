# MOBA item shop for Twisted Treeline.
# gen_store.py turns this into data/sql/custom/db_world/mod_moba_store.sql and
# client/addons/MobaHUD/Catalog.lua:
#   creature_template + creature_template_model for the shopkeeper (one entry per
#   team), their per-map spawns, and the catalog tables (mod_moba_store_npc /
#   _menu / _grant). ONE shopkeeper per base -- the `tabs` below are tabs in the
#   addon panel, not separate NPCs. Gear is granted in C++ by npc_moba_store.
#
# A menu group has exactly one of `subcategories` (a branch), `pieces` (one leaf
# per suffix, granting the whole bundle) or `items` (one leaf per fixed item, no
# suffix) -- nest as deep as you like. An `items:` entry is a bare item id, or a
# table overriding cost / count / name; a leaf label defaults to the item's own
# name from item_template.
# "of the X" items are stock green random-suffix bases: the shop stamps a suffix
# id onto the base at grant time. gen_store.py derives which suffixes a base may
# roll from item_template.RandomSuffix + item_enchantment_template and offers only
# those, so cloth shows caster suffixes only and the wand shows just three. A base
# that rolls NONE of the listed suffixes fails the run.
# Cost omitted = free (0).

map: 900

# Hand out our own copies of each item (entry + 900000) instead of the stock
# entries. Copies let us own SellPrice and Bonding and can never collide with a
# world drop -- but the client cannot render an item whose entry is absent from
# its Item.dbc (question-mark icon, zero suffix stats), so this stays off until
# the client patch ships those rows. Server-side everything works either way.
custom_items: false

# Suffix menu order. `id` is the ItemRandomSuffix.dbc id the vendor stamps onto
# the base item; `name` is only the menu label. gen_store.py verifies each id
# against item_template.RandomSuffix + item_enchantment_template, so a base is
# only offered under a suffix the game itself would roll on it.
# (The .dbc is not read at generation time -- env/dist is gitignored build
# output; a fresh clone must still be able to regenerate.)
suffixes:
  - { name: "of the Tiger",   id: 14 }
  - { name: "of the Bear",    id: 7 }
  - { name: "of the Monkey",  id: 5 }
  - { name: "of the Eagle",   id: 6 }
  - { name: "of the Owl",     id: 9 }
  - { name: "of the Gorilla", id: 10 }
  - { name: "of the Falcon",  id: 11 }
  - { name: "of the Boar",    id: 12 }
  - { name: "of the Wolf",    id: 13 }
  - { name: "of the Whale",   id: 8 }

# Fraction of an item's purchase cost it sells back for. Applied per menu group;
# a group may override with its own `sell_ratio`. Starting gear costs 0, so it
# sells for 0 without needing its own setting.
sell_ratio: 0.25

# Back slot is always a cloth cloak (no plate/mail/leather cloak exists). All 10.
cloak_item: 36416          # Regal Cloak (ilvl 182)

# The shopkeeper -- one per base, one creature entry per team. Entries must sit
# inside the reserved 900300-900399 window: the generated SQL clears that whole
# range, so an NPC dropped from this config is dropped from the DB too. (Without
# that, collapsing four vendors into one would leave 900302-900307 spawned.)
shopkeeper:
  name: "Shopkeeper"
  subname: "Goods & Gear"
  display_id: 3275
  teams:
    - { team: 0, entry: 900302, display_id: 3275, name: 'Dkeka',
        x: -193.75, y: 7.83, z: 3.0, o: 4.3253 }   # Alliance (west), 8.1 yd from spawn
    - { team: 1, entry: 900303, display_id: 1879, name: 'Tojakk',
        x: 193.75, y: 7.83, z: 3.0, o: 5.0995 }   # Horde (east), 9.1 yd from spawn

tabs:
  # -------------------------------------------------------------------------
  # STARTING GEAR -- free.
  #   armor / shield / accessories: category -> suffix, granting the whole set
  #                                 (8 slots + cloak for armor).
  #   weapons:                      category -> type -> suffix, granting one.
  # ilvl-182 level-80 green sets: Coldwraith / Geist / Spectral / Necropolis.
  # -------------------------------------------------------------------------
  - key: starting_gear
    name: "Starting Gear"
    # pieces order: head, shoulder, chest, wrist, hands, waist, legs, feet
    categories:
      - name: Cloth        # Coldwraith -- caster only (Eagle/Owl/Whale)
        append_cloak: true
        pieces: [36063, 36065, 36061, 36066, 36062, 36059, 36064, 36060]
      - name: Leather      # Geist
        append_cloak: true
        pieces: [36175, 36177, 36173, 36178, 36174, 36171, 36176, 36172]
      - name: Mail         # Spectral
        append_cloak: true
        pieces: [36287, 36289, 36285, 36290, 36286, 36283, 36288, 36284]
      - name: Plate        # Necropolis
        append_cloak: true
        pieces: [36399, 36401, 36397, 36402, 36398, 36395, 36400, 36396]
      - name: Shield       # Frozen Shield
        pieces: [36458]
      - name: Weapons      # type -> suffix -> a single weapon
        subcategories:
          - { name: "Sword (One-Hand)", pieces: [36528] }   # Skeleton's Sword
          - { name: "Sword (Two-Hand)", pieces: [36542] }   # Invasion Blade
          - { name: "Axe (One-Hand)",   pieces: [36584] }   # Snowy Edge
          - { name: "Axe (Two-Hand)",   pieces: [36598] }   # Scarlet Battle Axe
          - { name: "Mace (One-Hand)",  pieces: [36500] }   # Gargoyle's Mace
          - { name: "Mace (Two-Hand)",  pieces: [36514] }   # Kingly Battlehammer
          - { name: "Dagger",           pieces: [36486] }   # Ornate Pugio
          - { name: "Polearm",          pieces: [36612] }   # Scourge War Spear
          - { name: "Staff",            pieces: [36556] }   # Apocalyptic Staff
          - { name: "Fist Weapon",      pieces: [36570] }   # Corrupted Scythes
          - { name: "Bow",              pieces: [36626] }   # Military Compound Bow
          - { name: "Gun",              pieces: [36654] }   # Harsh-Winter Rifle
          - { name: "Crossbow",         pieces: [36640] }   # Scourge Crossbow
          - { name: "Wand",             pieces: [36668] }   # Mindless Wand -- caster suffixes only
      - name: Accessories  # 2 rings + 1 neck
        pieces: [36430, 36429, 36444]

  # -------------------------------------------------------------------------
  # CONSUMABLES -- 50s each. Fixed items, no suffixes.
  # Everything here is free of profession gates: bandages need First Aid 400,
  # bombs need Engineering and Crazy Alchemist's Potion needs Alchemy 400, so
  # none of those can be sold to an arbitrary character.
  # All potions share one combat cooldown, so it is one potion per fight.
  # -------------------------------------------------------------------------
  - key: consumables
    name: "Consumables"
    categories:
      - name: Potions
        cost: 5000
        items:
          - { entry: 33447, count: 5 }   # Runic Healing Potion
          - { entry: 33448, count: 5 }   # Runic Mana Potion
          - { entry: 2459,  count: 5 }   # Swiftness Potion -- +50% run speed 15s
          - { entry: 5634,  count: 3 }   # Free Action Potion -- stun/root immune 30s
          - { entry: 9172,  count: 3 }   # Invisibility Potion
          - { entry: 40093, count: 3 }   # Indestructible Potion -- +3500 armour
          - { entry: 40211, count: 3 }   # Potion of Speed -- +500 haste
          - { entry: 40212, count: 3 }   # Potion of Wild Magic -- +200 crit/spell power
      - name: Flasks                     # survive death, so they last the match
        cost: 5000
        items:
          - 46377                        # Flask of Endless Rage -- +180 attack power
          - 46376                        # Flask of the Frost Wyrm -- +125 spell power

  # -------------------------------------------------------------------------
  # RARE GEAR -- 1g each. ilvl 200 blues, every slot, two stat flavours per slot
  # (physical then caster). Cloth is caster-only, so it lists one per slot.
  # Mail's physical line carries intellect -- WotLK hunter mail always does.
  # Weapons are the Savage Gladiator's arena set: complete across all 14 types,
  # internally balanced, and resilience-carrying. Caster variants hang under the
  # 1H mace, dagger and staff, which are the only types the set splits.
  # -------------------------------------------------------------------------
  - key: rare_gear
    name: "Rare Gear"
    # slot order throughout: head, shoulder, chest, waist, legs, feet, wrist, hands
    categories:
