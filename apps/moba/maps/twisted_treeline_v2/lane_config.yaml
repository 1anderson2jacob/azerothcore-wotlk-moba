# Lane centerlines + creep formation for Twisted Treeline. gen_creep_paths.py
# densifies each lane and generates one offset path per slot per direction.
# `forward` = the order the points are walked (team 0 uses it); `reverse` is
# auto-generated for team 1. Walk each lane exactly once.
#
# Both lanes run west -> east, so Alliance (west) walks `forward` out of its own
# base. Centerlines are DERIVED, not traced or walked: a corridor-hugging path
# search over the walkable mask rasterised from geometry.json's loops, smoothed
# onto the local clearance maximum, resampled, then mirrored about x=0 so the two
# halves are identical. z is sampled from heights.png. Worst wall clearance is
# 11.3 yd (top) / 12.0 yd (bot), median ~14.7 -- so unlike pass 1 there is no
# point needing a hand repair, and no choke tight enough to be worth naming.
#
# One deliberate edit the derivation does not produce:
#   * both lanes leave the core on the same node. Point [1] is split +-3.5 yd off
#     the axis so the two lanes' waves do not spawn on the same spot.

max_spacing: 5.0             # max yards between generated nodes; KEEP ~5 --
                            # sparser nodes break creep re-aggro (see README)

# Default formation, one entry per creep path per team. `lateral_offset`: yards
# sideways from the centerline, positive = the creep's own LEFT (mirrored
# automatically for the other team). `longitudinal_offset`: yards along travel,
# positive = ahead (also staggers the formation at spawn).
slots:
  - {name: melee_left,  lateral_offset:  3.0, longitudinal_offset:  6.0}
  - {name: melee_right, lateral_offset: -3.0, longitudinal_offset:  6.0}
  - {name: caster,      lateral_offset:  0.0, longitudinal_offset:  0.0}
  - {name: siege,       lateral_offset:  0.0, longitudinal_offset: -6.0}
  - {name: super,       lateral_offset:  0.0, longitudinal_offset:  12.0}

# One entry per lane: `name`, `points` (walked centerline as [x, y, z] triples in
# walk order), and optionally its own `slots` overriding the default above.
# Runs base-to-base: team 0 spawns at the Alliance base (first point) and walks
# to the Horde base (last point); team 1 walks the reverse.
