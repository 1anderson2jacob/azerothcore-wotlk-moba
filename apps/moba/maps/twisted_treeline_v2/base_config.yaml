# Base-camp tunables for Twisted Treeline: respawn/recall/fountain timing plus
# the two teams' spawn locations. Tunables land in mod_moba_base; the spawn
# locations are written into game_graveyard / battleground_template.
# All *_ms values are milliseconds; *_pct are percent of max (0-100).
#
# Alliance is WEST (-x), Horde EAST (+x), matching the blockout's own
# TT_Blue_/TT_Red_ naming. Randomising sides per match is a later feature: it
# makes PLACEMENT side-keyed while creature templates stay faction-keyed, so it
# needs a runtime binding rather than a config field.

map: 900
battleground_template_id: 7          # EotS slot this mode hijacks
active: true                         # owns slot 7; eye_of_the_storm is active: false
min_players_per_team: 1              # a MOBA keeps playing 4v5 rather than forfeiting

kill_credit_window_ms: 15000         # last-hit window for kill credit
assist_window_ms: 10000              # recent-damage window that grants an assist
assist_buff_max_duration_ms: 60000   # cap on the assist reward buff

respawn:
  base_ms: 10000                     # floor respawn delay
  per_min_ms: 1500                   # added per elapsed match-minute
  cap_ms: 60000                      # ceiling on the scaled delay

recall:
  cast_time_ms: 9000
  empowered_cast_time_ms: 4500       # faster recall in friendly territory

fountain:
  tick_ms: 1000                      # heal-tick cadence
  hp_pct: 10
  mana_pct: 10

spawn:
  # The spawn dome's radius, the fountain heal zone, and the shop's buy/sell range
  # -- ONE value driving all three.
  # The generator sizes the dome GOs from it (gameobject_template.size =
  # radius / 172.4, the GeoBox half-extent of displayId 7203) and writes the same
  # number to mod_moba_base.FountainRadius, so the two cannot drift.
  # Uniform model scale: a wider dome is also a taller one.
  #
  # 20 is bounded from BELOW by the shopkeeper, which must stand inside the dome
  # (8.1 yd out), and from ABOVE by nothing on this map: the core is 64 yd away,
  # so unlike pass 1 the dome cannot reach it. The base platform runs ~80 yd east
  # of the spawn before dropping to lane floor, and 20 keeps the bubble clear of
  # the island the base wraps around.
  radius: 20
  dome: {alliance_entry: 900402, horde_entry: 900403}
  # Graveyards 1103/1104 are REUSED, not freshly allocated: BattlegroundMOBA.h
  # hardcodes those two ids in GetClosestGraveyard. New ids mean making that
  # per-map data first -- two mod_moba_base columns and a C++ read.
  # z 3.5 = the measured platform top (3.000) plus clearance. The map is a WMO with
  # no terrain under it, so a z BELOW the collision floor drops a releasing player
  # into the void rather than snapping them up; erring high costs a harmless step.
  alliance: {graveyard_id: 1103, x: -196.80025, y:  0.3477315, z: 3.5, o: 6.2737}
  horde:    {graveyard_id: 1104, x:  197.60576, y: -0.386557,  z: 3.5, o: 3.1396}

# Match economy. All copper -- the match wallet mirrors the coin denomination
# rather than being a separate resource, so these read against store_config
# prices directly (cheapest item today: 5000).
gold:
  starting_stipend: 15000      # in the wallet on entry; 0 = start broke
  # Cadence is a traffic knob as much as a pacing one: every accrual pushes an
  # S: payload per player, which also repaints an open shop panel. 5s at 100c is
  # the same 20 copper/sec as 1s at 20c, for a fifth of the messages.
  passive_tick_ms: 5000
  passive_per_tick: 100
  # Streak bounties, paid ON TOP of the flat per-kill reward in player_config.yaml
  # (10000c today). A shutdown scales with the streak it ended, so cutting down a
  # fed player is a real swing -- capped so one kill can never fund a whole build.
  first_blood: 5000            # bonus for the match's first player kill; 0 = off
  shutdown_per_streak: 5000    # x the victim's consecutive-kill count
  shutdown_cap: 40000          # ceiling on that product; 0 = uncapped

# Kill streaks. spree_min does double duty deliberately: it is both the streak
# length that first announces a spree and the length that makes a victim worth a
# shutdown. "On a spree" has to mean one thing, or the feed says a player is on a
# spree while the bounty says they are not.
streaks:
  multi_kill_window_ms: 10000  # a kill this soon after the last extends the multi-kill; 0 = multi-kills off
  spree_min: 3                 # consecutive kills that announce a spree / mark a shutdown target; 0 = both off
  ace_min_team: 2              # smallest wiped team that counts as an ace; 0 = ace off

# Surrender. A team votes; it passes at all-but-one of the team, floored so a duo
# still needs both. The time gate is measured from doors open -- the same clock
# the HUD bar shows -- so "available at 1:00" means the 1:00 the player can see.
surrender:
  min_match_ms: 60000          # earliest a vote may start; 0 = no gate
  vote_duration_ms: 15000      # how long a vote stays open before silence fails it; must be > 0
  vote_cooldown_ms: 60000      # after a FAILED vote, before that team may start another; 0 = none
