# Twisted Treeline v2 -- blockout source parameters. gen_blockout.py reads this
# and drives apps/moba/wmo/blockout_trace.py inside Blender.
#
# The painted trace is the geometry source of truth. This file holds only what a
# flat image cannot carry: the scale it should be read at, what its colours mean,
# and how high the raised regions sit.

trace: var/blender/tt_v2_trace.png    # repo-relative

# Registration is derived from the paint, not authored -- `cx` from the trace's
# own mirror symmetry, `cy` from its bbox centre, and the scale from this width.
# Rescaling the map is a change to this one number: no repaint, no re-trace.
map_width_yd: 432.0

# Paint key. Each opaque pixel takes the nearest of these in RGB, so an
# anti-aliased edge splits at the 50% blend point rather than being rejected.
# Anything below alpha_threshold is not walkable.
palette:
  floor: "#00FF00"                   # lanes, jungle, brush, pit
  base:  "#0000FF"                   # raised base platform
  ramp:  "#FF8000"                   # slope joining the two
alpha_threshold: 0.5

elevation:
  base_yd: 3.0                       # platform height above the lane floor. MUST stay
                                     # above mmaps' walkableClimb (1.60 yd, Config.h)
                                     # or the platform edge is climbable from any side
  ramp_blur_yd: 1.5                  # softens the crease at the top and foot of a ramp

smoothing:
  # Circular Gaussian low-pass on the arc-length parameterised contour. A wiggle of
  # wavelength L is attenuated by exp(-2*pi^2*sigma^2/L^2): at sigma 2.0 a 4 yd
  # stylus tremor is 99% gone while a 32 yd curve keeps 93% of its amplitude.
  # Douglas-Peucker is NOT usable here -- it preserves maximum-deviation points,
  # which on a hand trace are precisely the tremor.
  sigma_yd: 2.0
  resample_yd: 4.5                   # output spacing; the cutter vertex ceiling
  min_blob_yd2: 30.0                 # stray paint specks, dropped before tracing
  min_loop_yd2: 120.0                # islands below this are not worth a wall

blockout:
  # Floor tessellation. Coarse everywhere, fine only across a slope -- a uniform
  # target fine enough for a 6 yd ramp puts tens of thousands of vertices on flat
  # ground, and a WMO group indexes its vertices with 16 bits.
  floor_edge_yd: 12.0
  floor_detail_edge_yd: 1.5
  bottom_yd: -8.0                  # underside of every wall solid

  wall:
    height_yd: 16.0                # nominal; each segment varies about this
    variation_yd: 4.0              # so segments land in 12-20
    segment_yd: 70.0               # how often the height re-rolls along a loop
    terrace_drop_yd: 8.0           # the two ~8 yd steps
    terrace_ledge_yd: 2.5          # ledge width between them
    bevel_yd: 0.75                 # chamfer on the top edge
    outer_margin_yd: 30.0          # plateau width beyond the map's convex hull
    outer_step_yd: 15.0            # point spacing on that hull

  # ---------------------------------------------------------------- surfaces
  # A registry of every material the map may use, and separately what wears
  # which. Split because the wall pool has no business knowing how many walls
  # the trace produced.
  #
  # `texture` is an MPQ path and is NOT shipped -- MOTX stores the string, so any
  # number of stock textures costs zero archive bytes. Enumerate candidates with
  # `mpq_tool.py find`; gen_blockout rejects a path that is not lowercase (the
  # BLP->PNG import does a `.replace('.blp', ...)` that misses `.BLP`) or that
  # ends `_s.blp`, which is a specular map and never a diffuse.
  #
  # Single-quoted so YAML leaves the backslashes alone.
  materials:
    # lane floor -- one per floor chunk. NOTE the chunks are a batch-budget grid,
    # not map regions, so these read as rectangles with straight seams. Fine for
    # comparing six textures; not a shipping look.
    #
    # These come from TILESET\ rather than DUNGEONS\TEXTURES\ on purpose: ground
    # art is authored for a horizontal surface seen from above, which is what a
    # lane is. The argument against it applies to vertical faces, not this.
    # All six are 256x256 so resolution is not a variable.
    lane_ashenvale:      {texture: 'tileset\ashenvale\ashenvalegrass.blp'}
    lane_darkshore_moss: {texture: 'tileset\darkshore\darkshoremossgrass.blp'}
    lane_duskwood:       {texture: 'tileset\duskwood\duskwoodgrassbase.blp'}
    lane_hyjal:          {texture: 'tileset\hyjal\hyjalgrassbase.blp'}
    lane_grizzly:        {texture: 'tileset\expansion02\grizzlyhills\gh_grassya.blp'}
    lane_ghostlands:     {texture: 'tileset\expansion01\ghostlands\ghostlandsgrass01.blp'}

    walkway: {texture: 'dungeons\textures\floor\jlo_dmaul_walkway.blp', uv_scale_yd: 6.0}

    # Wall candidates. uv_scale is held at 4.0 across all of them ON PURPOSE:
    # vary texture and tiling rate together and the comparison decides nothing.
    # Tune scale in a later build, on the winner.
    #
    # Lower band -- floor up to the terrace ledge.
    ne_01:           {texture: 'dungeons\textures\walls\mm_ne_wall_01.blp',              uv_scale_yd: 4.0}
    ne_02:           {texture: 'dungeons\textures\walls\mm_ne_wall_02.blp',              uv_scale_yd: 4.0}
    ne_ds_01:        {texture: 'dungeons\textures\walls\mm_ne_ds_wall_01.blp',           uv_scale_yd: 4.0}
    ne_tower_01:     {texture: 'dungeons\textures\walls\bh_ne_tower_wall_01.blp',        uv_scale_yd: 4.0}
    dmaul_01:        {texture: 'dungeons\textures\walls\bm_dmaul_wall01.blp',            uv_scale_yd: 4.0}
    dmaul_02:        {texture: 'dungeons\textures\walls\bm_dmaul_wall02.blp',            uv_scale_yd: 4.0}
    barrow_den:      {texture: 'dungeons\textures\walls\bm_barrow_denwall01.blp',        uv_scale_yd: 4.0}
    barrow_dirt:     {texture: 'dungeons\textures\walls\bm_barrow_dirtwall01.blp',       uv_scale_yd: 4.0}
    kzn_outer:       {texture: 'dungeons\textures\walls\bm_kzn_outerwall01.blp',         uv_scale_yd: 4.0}
    kzn_large:       {texture: 'dungeons\textures\walls\bm_kzn_largewall01.blp',         uv_scale_yd: 4.0}
    kzn_green:       {texture: 'dungeons\textures\walls\jlo_kzn_greenstone.blp',         uv_scale_yd: 4.0}
    shdwfang_outer:  {texture: 'dungeons\textures\walls\bm_shdwfang_outerwall_01.blp',   uv_scale_yd: 4.0}
    shdwfang_stones: {texture: 'dungeons\textures\walls\bm_shdwfang_largestones_01.blp', uv_scale_yd: 4.0}
    mcave_rock:      {texture: 'dungeons\textures\rock\jlo_mcaveexg_rock.blp',           uv_scale_yd: 4.0}
    mrdn_rockwall:   {texture: 'dungeons\textures\rock\jlo_mrdn_rockwall.blp',           uv_scale_yd: 4.0}

    # Upper band -- ledge, upper riser, chamfer and top surface. Paired with the
    # lower band's family on each island, so a wall reads as one material with
    # tier variation rather than two unrelated ones.
    ne_03:             {texture: 'dungeons\textures\walls\mm_ne_wall_03.blp',              uv_scale_yd: 4.0}
    ne_ds_02:          {texture: 'dungeons\textures\walls\mm_ne_ds_wall_02.blp',           uv_scale_yd: 4.0}
    ne_ds_03:          {texture: 'dungeons\textures\walls\mm_ne_ds_wall_03.blp',           uv_scale_yd: 4.0}
    ne_tower_03:       {texture: 'dungeons\textures\walls\bh_ne_tower_wall_03.blp',        uv_scale_yd: 4.0}
    dmaul_base:        {texture: 'dungeons\textures\walls\bm_dmaul_wallbase01.blp',        uv_scale_yd: 4.0}
    dmaul_hall:        {texture: 'dungeons\textures\walls\jlo_dmaul_hallwall.blp',         uv_scale_yd: 4.0}
    barrow_den02:      {texture: 'dungeons\textures\walls\bm_barrow_denwall02.blp',        uv_scale_yd: 4.0}
    barrow_stair:      {texture: 'dungeons\textures\walls\bm_barrow_stairwall01.blp',      uv_scale_yd: 4.0}
    kzn_outer02:       {texture: 'dungeons\textures\walls\bm_kzn_outerwall02.blp',         uv_scale_yd: 4.0}
    kzn_plain:         {texture: 'dungeons\textures\walls\bm_kzn_plainwall01.blp',         uv_scale_yd: 4.0}
    kzn_black:         {texture: 'dungeons\textures\walls\jlo_kzn_blackstone.blp',         uv_scale_yd: 4.0}
    shdwfang_outer03:  {texture: 'dungeons\textures\walls\bm_shdwfang_outerwall_03.blp',   uv_scale_yd: 4.0}
    shdwfang_stones02: {texture: 'dungeons\textures\walls\bm_shdwfang_largestones_02.blp', uv_scale_yd: 4.0}
    mcave_crock:       {texture: 'dungeons\textures\rock\jlo_mcaveexg_crock.blp',          uv_scale_yd: 4.0}
    mrdn_rockwall02:   {texture: 'dungeons\textures\rock\jlo_mrdn_rockwall02.blp',         uv_scale_yd: 4.0}

    # The perimeter ribbon. Rough rock below the terrace ledge, dressed courses
    # above, so the ledge reads as the seam between the two tiers.
    #
    # Named for the SURFACE, not the texture, so trying a candidate stays a
    # repoint here -- renaming a key changes the material name, which is what
    # forces an OBJ round trip and a fresh 3.4 import.
    perimeter_lower: {texture: 'dungeons\textures\rock\bm_kzn_rockwall01.blp', uv_scale_yd: 6.0, uv_jitter: 0.15}
    perimeter_upper: {texture: 'dungeons\textures\rock\jlo_mcave_rock.blp',    uv_scale_yd: 5.0, uv_jitter: 0.12}

    # The previous incumbent. Unassigned now, kept as the path to revert to.
    ghostlands_rock: {texture: 'tileset\expansion01\ghostlands\ghostlandsrock01.blp', uv_scale_yd: 4.0}

  surfaces:
    # Every value here is one material key, or a list of them cycled -- over floor
    # chunks for `floor`, over islands for `island_walls`.
    #
    # Floor class is decided by height, not by chunk: lane at z<=0.25,
    # base at z>=base_yd-0.25, ramp between.
    floor:
      lane: lane_darkshore_moss
      base: walkway
      ramp: walkway

    # A bare name means one material on every band; a mapping names each.
    outer_wall:
      lower: perimeter_lower
      upper: perimeter_upper

    # One entry per island per band. A shorter list cycles and a longer one
    # silently drops its tail, so these lengths track the trace's island count.
    #
    # Mirror-twin islands number adjacently (descending area), so consecutive
    # entries land on the same shape in mirrored positions. The three centreline
    # islands (indices 2, 4, 8) have no twin.
    island_walls:
      lower: [ne_01, ne_02, ne_ds_01, dmaul_01, ne_tower_01, dmaul_02,
              barrow_den, barrow_dirt, kzn_outer, kzn_large, kzn_green,
              shdwfang_outer, shdwfang_stones, mcave_rock, mrdn_rockwall]
      upper: [ne_03, ne_ds_02, ne_ds_03, dmaul_base, ne_tower_03, dmaul_hall,
              barrow_den02, barrow_stair, kzn_outer02, kzn_plain, kzn_black,
              shdwfang_outer03, shdwfang_stones02, mcave_crock, mrdn_rockwall02]

  uv_scale_yd: 8.0                 # default when a material states none
  uv_jitter: 0.0                   # per-vertex UV wobble, as a fraction of a tile.
                                   # Per-material override too, like uv_scale_yd
  export_collection: TT_WMO_Export
  seed: 20260818                   # height variation and scatter are deterministic

  # ---------------------------------------------------------------- dressing
  # M2 doodads on the wall tops and the wall faces. Placements are RESOLVED, not
  # authored: this block plus the built geometry produce
  # var/blender/<bundle>_doodads.json, which blender_staging_setup.py
  # instantiates. That is the whole reason the 3.4 staging scene stays derived --
  # a doodad dragged into it by hand would be the one thing in that file no
  # rebuild could reproduce.
  #
  # Models cost nothing to ship. MODN stores the path string exactly as MOTX
  # stores a texture's, so the client patch carries no M2 and no BLP.
  dressing:
    max_slope_deg: 30.0            # a HORIZONTAL surface steeper than this takes
                                   # no doodad. MUST stay under the bevel's 45 deg
                                   # (0.75 yd rise over a 0.75 yd inset) or every
                                   # wall top wears a ring of trees hanging off
                                   # its chamfer. Wall faces never consult it: a
                                   # riser is exactly vertical by construction,
                                   # so the band spans already answer which faces
                                   # they are

    # `height_yd` is the height the family is scaled TO. gen_blockout.py probes
    # each M2's own bounding box and divides, so the per-model scale is derived
    # and swapping in a bigger model does not silently grow the tree.
    #
    # WHERE the model is measured from differs by surface, and that is why a
    # family may only be used on one kind. A cap stands the model on its origin,
    # so anything the author left below z=0 is buried and is not height. A wall
    # face buries nothing, and models authored to hang put every vertex BELOW the
    # origin -- azjol_hangingfern_01 tops out at 0.27, which read as a height
    # scales it 96x.
    #
    # Height is held constant WITHIN each comparable group on purpose, the same
    # way the wall textures hold uv_scale at 4.0: vary silhouette and size
    # together and the comparison decides nothing. Native sizes span 1 to 215 yd.
    families:
      duskwood_spooky:
        height_yd: 26.0
        models:
          - 'world\azeroth\duskwood\passivedoodads\trees\duskwoodspookytree01.m2'
          - 'world\azeroth\duskwood\passivedoodads\trees\duskwoodspookytree02.m2'
          - 'world\azeroth\duskwood\passivedoodads\trees\duskwoodspookytree03.m2'
      duskwood_canopy:
        height_yd: 26.0
        models:
          - 'world\azeroth\duskwood\passivedoodads\trees\duskwoodtreecanopy01.m2'
          - 'world\azeroth\duskwood\passivedoodads\trees\duskwoodtreecanopy02.m2'
          - 'world\azeroth\duskwood\passivedoodads\trees\duskwoodtreecanopy03.m2'
      ghostlands:
        height_yd: 26.0
        models:
          # GhostlandsTree02 is deliberately absent: it probes 0 bounding
          # triangles, so it renders and never reaches the vmaps.
          - 'world\expansion01\doodads\generic\bloodelf\trees\ghostlandstree03.m2'
          - 'world\expansion01\doodads\generic\bloodelf\trees\ghostlandstree04.m2'
      felwood:
        height_yd: 26.0
        models:
          - 'world\kalimdor\felwood\passivedoodads\tree\felwoodtree01.m2'
          - 'world\kalimdor\felwood\passivedoodads\tree\felwoodtree02.m2'
      # The same two models split apart so they can carry different heights.
      # Scaled to a common height they are not comparable: 02 ships 2.4x the
      # canopy and 1.6x the root flare of 01, because height fixes one axis and
      # leaves the other to the model's own proportions.
      felwood_tall:
        height_yd: 26.0
        models:
          - 'world\kalimdor\felwood\passivedoodads\tree\felwoodtree01.m2'
      felwood_wide:
        height_yd: 16.5
        models:
          - 'world\kalimdor\felwood\passivedoodads\tree\felwoodtree02.m2'
      tirisfal:
        height_yd: 26.0
        models:
          - 'world\lordaeron\tirisfalglade\passivedoodads\trees\tirisfallgladecanopytree02.m2'
          - 'world\lordaeron\tirisfalglade\passivedoodads\trees\tirisfallgladecanopytree03.m2'
          - 'world\lordaeron\tirisfalglade\passivedoodads\trees\tirisfallgladecanopytree04.m2'
      silverpine:
        height_yd: 26.0
        models:
          - 'world\lordaeron\silverpine\passivedoodads\trees\silverpinetree01.m2'
          - 'world\lordaeron\silverpine\passivedoodads\trees\silverpinetree03.m2'
      ashenvale:
        height_yd: 26.0
        models:
          - 'world\kalimdor\ashenvale\passivedoodads\ashenvaletrees\ashenvaletree02.m2'
          - 'world\kalimdor\ashenvale\passivedoodads\ashenvaletrees\ashenvaletree03.m2'
      feralas:
        height_yd: 26.0
        models:
          - 'world\kalimdor\feralas\passivedoodads\tree\feralastree01.m2'
      deadwind_rock:
        height_yd: 26.0
        models:
          - 'world\azeroth\deadwindpass\passivedoodads\rocktrees\deadwindpassrocktree01.m2'
          - 'world\azeroth\deadwindpass\passivedoodads\rocktrees\deadwindpassrocktree02.m2'
          - 'world\azeroth\deadwindpass\passivedoodads\rocktrees\deadwindpassrocktree03.m2'
      stonetalon_burnt:
        height_yd: 26.0
        models:
          - 'world\kalimdor\stonetalon\passivedoodads\trees\burntstonetree01.m2'
          - 'world\kalimdor\stonetalon\passivedoodads\trees\burntstonetree07.m2'
          - 'world\kalimdor\stonetalon\passivedoodads\trees\burntstonetree08.m2'
      moonglade:
        height_yd: 26.0
        models:
          - 'world\kalimdor\moonglade\passivedoodads\moongladetrees\moongladetree02.m2'
          - 'world\kalimdor\moonglade\passivedoodads\moongladetrees\moongladetree03.m2'
      grizzly:
        height_yd: 26.0
        models:
          - 'world\expansion02\doodads\grizzlyhills\trees\grizzlyhills_tree01.m2'
          - 'world\expansion02\doodads\grizzlyhills\trees\grizzlyhills_tree05.m2'
      crystalsong:
        height_yd: 26.0
        models:
          - 'world\expansion02\doodads\crystalsongforest\trees\crystalsongtree01.m2'
          - 'world\expansion02\doodads\crystalsongforest\trees\crystalsongtree03.m2'
      zuldrak:
        height_yd: 26.0
        models:
          - 'world\expansion02\doodads\zuldrak\trees\zuldrak_largetree_01.m2'
          - 'world\expansion02\doodads\zuldrak\trees\zuldrak_largetree_02.m2'
      plagueland:
        height_yd: 26.0
        models:
          - 'world\lordaeron\plagueland\passivedoodads\trees\plaguelandtree01.m2'
          - 'world\lordaeron\plagueland\passivedoodads\trees\plaguelandtree02.m2'
          - 'world\lordaeron\plagueland\passivedoodads\trees\plaguelandtree03.m2'
      # The control on the outer ring, same role ghostlands_rock plays for the
      # wall textures. Taller because it is the horizon, not a wall top.
      elwynn_canopy:
        height_yd: 30.0
        models:
          - 'world\azeroth\elwynn\passivedoodads\trees\elwynntreecanopy01.m2'
          - 'world\azeroth\elwynn\passivedoodads\trees\elwynntreecanopy02.m2'
          - 'world\azeroth\elwynn\passivedoodads\trees\elwynntreecanopy03.m2'


      # Terrace-ledge catalogue. One height across all 87 for the same reason
      # the wall textures hold uv_scale at 4.0: vary silhouette and size
      # together and the comparison decides nothing. 5.0 yd sits the whole post
      # against the 7.25 yd upper riser rather than over the wall crest --
      # deliberate, and the first thing to revisit if they do not read from a
      # lane.
      #
      # Ordered NARROWEST scaled box first. Nothing is rejected for width, so
      # the order only decides WHERE a model appears: the best-fitting ones land
      # on the islands a walk visits, the 3-10 yd wrecks on the perimeter where
      # they cost nothing. Native heights span 2.0 to 10.0 yd, so the scale
      # range is wide and the box widths with it.
      lampposts:
        height_yd: 5.0
        models:
          - 'world\expansion02\doodads\generic\oracle\o_lamppost_01.m2'
          - 'world\expansion02\doodads\generic\forsaken\fk_lamppost.m2'
          - 'world\expansion02\doodads\generic\forsaken\fk_lamppost_unlit.m2'
          - 'world\azeroth\westfall\passivedoodads\lamppost\westfalllamppost.m2'
          - 'world\expansion01\doodads\generic\bloodelf\lamp\be_lamp01.m2'
          - 'world\azeroth\westfall\passivedoodads\lamppost\westfalllamppost02.m2'
          - 'world\azeroth\westfall\passivedoodads\lamppost\westfalllamppost01.m2'
          - 'world\expansion01\doodads\generic\ethereal\lamppost\et_lamppost01off.m2'
          - 'world\expansion02\doodads\wintertauren\wt_lamppost01.m2'
          - 'world\expansion02\doodads\grizzlyhills\trappers\trapperlamppost_01.m2'
          - 'world\generic\passivedoodads\lunarnewyear\lunarnewyearlantern_horde_standing.m2'
          - 'world\kalimdor\darkshore\passivedoodads\lamp\darkstreetlamp02.m2'
          - 'world\expansion01\doodads\generic\draenei\lampposts\dr_lamppost_01.m2'
          - 'world\generic\nightelf\passive doodads\lamps\kalidarstreetlamp02.m2'
          - 'world\generic\passivedoodads\lunarnewyear\lunarnewyearlantern_alliance_standing.m2'
          - 'world\generic\human\passive doodads\lamps\westernplaguelandslampoststraight.m2'
          - 'world\kalimdor\felwood\passivedoodads\lamp\felwoodlamp01.m2'
          - 'world\generic\human\passive doodads\lamps\westernplaguelandslampost02.m2'
          - 'world\generic\human\passive doodads\lamps\westernplaguelandslampost01.m2'
          - 'world\expansion02\doodads\grizzlyhills\trappers\trapperlamppost_01_unlit.m2'
          - 'world\generic\human\passive doodads\lamps\westernplaguelandslampostbroken02.m2'
          - 'world\generic\human\passive doodads\lamps\westernplaguelandslampoststraightoff.m2'
          - 'world\generic\human\passive doodads\lamps\westernplaguelandslampostbroken01.m2'
          - 'world\expansion02\doodads\generic\ancientnightelf\borean_roadlamp01.m2'
          - 'world\expansion02\doodads\dalaran\dalaran_lamppost01.m2'
          - 'world\kalimdor\darkshore\passivedoodads\lamp\darkstreetlamp.m2'
          - 'world\expansion01\doodads\generic\ethereal\lamppost\et_lamppost01.m2'
          - 'world\generic\human\passive doodads\lamps\tirisfallstreetlamp01.m2'
          - 'world\generic\human\passive doodads\hanginglanterns\generalhanginglantern01.m2'
          - 'world\generic\nightelf\passive doodads\lamps\darnassusstreetlamp02.m2'
          # 0 bounding triangles: renders, never reaches the vmaps. Kept anyway
          # -- a ledge 4-12 yd up has no navmesh consequence either way, which
          # is the whole reason this surface could take collision models at all.
          - 'world\expansion02\doodads\generic\forsaken\fk_lamphanging.m2'
          - 'world\expansion02\doodads\furbolgs\fb_lamppost_darkshore_01.m2'
          - 'world\expansion01\doodads\generic\ancientorc\lampost\ao_lamppost01.m2'
          - 'world\generic\human\passive doodads\lamps\plaguelandslamp.m2'
          - 'world\expansion02\doodads\generic\vrykul\lamppost\vr_lamppost_02.m2'
          - 'world\expansion02\doodads\stratholme_past\ld_stratholmestreetlamp01.m2'
          - 'world\expansion01\doodads\eversong\lamppost\be_lamppost_eversong01-optimized.m2'
          - 'world\expansion01\doodads\eversong\lamppost\be_lamppost_eversong01.m2'
          - 'world\expansion02\doodads\generic\irondwarf\id_lamppost.m2'
          - 'world\expansion01\doodads\ghostlands\lampposts\be_lamppost_ghostlands01.m2'
          - 'world\expansion01\doodads\ghostlands\lampposts\be_lamppost_ghostlands02.m2'
          - 'world\expansion02\doodads\generic\vrykul\lamppost\vr_lamppost_03.m2'
          - 'world\expansion02\doodads\furbolgs\fb_lamppost_gh_01.m2'
          - 'world\generic\human\passive doodads\lamps\stormwindstreetlamp01.m2'
