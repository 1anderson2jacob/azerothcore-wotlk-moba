    # Density is per 1000 yd2 of the surface, projected onto the map plane,
    # which is what reads as spacing from a top-down camera.
    #
    # `families` takes one name, or a list cycled over the objects of that
    # surface -- islands in trace order.
    surfaces:
      outer_plateau:
        families: elwynn_canopy
        per_1000_yd2: 14.0
        min_spacing_yd: 5.0
        scale_jitter: 0.20
        sink_yd: 1.0
        edge_margin_yd: 0.0 # the outer edge is the horizon; overhang there is free
      island_caps:
        # A COMPARISON BUILD, not a chosen look: one candidate family per island,
        # 15 of them, walked on the same stops the wall-texture build uses.
        # Mirror twins deliberately differ here -- dressing symmetry is not a
        # fairness property, and a distinct family per island is more per walk.

        # Ordered widest footprint first, because islands are numbered by
        # descending area and the footprint test rejects a tree whose canopy
        # overruns the cap. Arbitrary order strands whichever wide family lands
        # on a small island: it cost four bare islands against two.
        families: [feralas, ghostlands, felwood, ashenvale, duskwood_canopy,
                   deadwind_rock, moonglade, plagueland, duskwood_spooky, zuldrak,
                   tirisfal, silverpine, grizzly, stonetalon_burnt, crystalsong]
        per_1000_yd2: 6.0
        min_spacing_yd: 5.0
        scale_jitter: 0.15
        sink_yd: 1.0
        edge_margin_yd: 0.0 # canopy over the drop is wanted, and nothing walks
                            # at cap height for it to obstruct
  
      # A CATALOGUE, not a chosen look: 87 lampposts, one per slot, in list
      # order. rail_on_ledge stops when the list runs out, so the spacing is
      # picked to make the two meet -- 34 yd gives 92 slots against 87 models.
      # The 13 island shelves are walked before the outer ring, so the catalogue
      # lands where the texture walk already goes and the perimeter takes the
      # tail.
      #
      # No per_1000_yd2 and no min_spacing_yd: a rail is not a density. No
      # edge_margin_yd either -- nothing is rejected for width here, and the
      # count of posts wider than their own shelf comes back in the legend.
      terrace_ledges:
        families: lampposts
        spacing_yd: 34.0
        sink_yd: 0.1                     # the shelf is a flat built quad, so
                                         # this only stops a base plate z-fighting

      # A FILL, not a catalogue: the mix is drawn per slot, so there is no
      # period to spot walking it. Island shelves and the perimeter's are
      # separate surfaces because they are read at very different distances.
      #
      # `scale` multiplies the family height for THIS surface only -- every
      # family here is shared with island_caps or outer_plateau, and shrinking
      # it in the families block would shrink those too.
      terrace_ledge_trees:
        scope: islands
        families: [felwood_tall, felwood_wide]
        spacing_yd: 12.0
        sink_yd: 1.0
        scale: 0.9
        shuffle: true

      terrace_ledge_trees_outer:
        scope: outer
        families: [felwood_tall, felwood_wide]
        spacing_yd: 12.0
        sink_yd: 1.0
        scale: 0.9
        shuffle: true

    # Explicit single-model placements. Scatter answers "how does a mass of
    # these read" and a catalogue rail answers "which of these do I want";
    # neither can put ONE model at ONE place, which is what marking a base is.
    #
    # `anchor` is the only hand-authored number: the nearest riser face to it
    # carries the model, and yaw, height within the band and the push out of the
    # wall all come off that face. Both anchors sit on the map-centre-facing
    # side of each base's inner island.
    placements:
      - model: 'world\expansion02\doodads\dalaran\dalaran_banner_alliance_02.m2'
        height_yd: 8.0
        anchor: [-171.7, -0.3]
      - model: 'world\expansion02\doodads\dalaran\dalaran_banner_horde_02.m2'
        height_yd: 8.0
        anchor: [171.8, -2.5]
