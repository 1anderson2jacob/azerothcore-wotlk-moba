# Neutral (jungle) camps for Twisted Treeline. Camps own placement + respawn +
# aggro/leash ranges; mobs own stats/display/drops. A `members` entry references
# a mob `key`; `pos` is [x, y, z, orientation]. A mob placed in no camp is
# skipped. Ranges/lockfile rules: apps/moba/README.md.
#
#   units                          reusable definitions of what a mob IS. A mob
#                                  names one with `unit:` and may override any
#                                  field it sets -- wholesale per field, never
#                                  merged (a row restating `drops` replaces the
#                                  list; `drops: []` means none). A unit may not
#                                  set `key`.
#   source                         creature_template entry id this copies stats
#                                  from. Pinned by digest in the lockfile -- an
#                                  upstream retune fails the run until you
#                                  re-run with --rebless-sources.
#   respawn_ms / initial_spawn_ms  milliseconds
#   tier                           0 = ordinary camp. Nonzero marks a boss, which
#                                  the kill feed announces (B: payload). It selects
#                                  nothing else -- stats and drops are the mob's.
#   spawn_warn_ms                lead time on the "spawning soon" line; 0 = none.
#                                  Must be < respawn_ms.
#   aggro_range / leash_range      yards
#   *_modifier                     multiplier on the source creature's stat
#   creature_type                  optional; overrides source type (enum
#                                  CreatureType). The jungle sources are
#                                  Humanoid (7), so Beast (1) is explicit.
#   drops[].type                   buff | gold | item | team_gold | team_buff
#
# Camp anchors are derived: the nearest point to each pass-1 anchor with 7.5+ yd of
# wall clearance that stays 18+ yd off both lane centrelines. Members cluster within
# 4 yd, facing the map centre, each snapped individually to hold 5.5 yd. Wolves and
# wraiths spread outward from centre; GOLEMS SPREAD NORTH -- outward puts them into
# the jungle wall the camp is pinched against.
#
# DISPLAY IDS ARE PLACEHOLDERS inherited from the original EotS roster --
# proven to render, but wrong for the art direction (Ghostlands/Plaguelands dead
# elegance). Audition replacements in-game with .morph <id> and swap them here.

