# Quest givers and the gear chains they offer, for Twisted Treeline.
# gen_quests.py turns this into data/sql/custom/db_world/mod_moba_quests.sql: the
# givers and their spawns, every quest and its text, the one-quest-per-animal
# conditions, the invisible credit entries, the battleground's quest block,
# kill-credit and volume tables, and the baked reward items. Ids are allocated into
# quest_config.lock.json -- never hand-edit it. A quest id must not change once a
# client has seen it: the client caches quest text by id.
#
# A quest is written once per animal and expanded per reward set: every set whose
# `animals` names it gets its own chain, one quest per `counts` entry, all sharing
# the animal's objective, text and credit entry.
#
#   quest_sort_id   AreaTable id the quest log files these quests under
#   quest_level     the quests' level, which colours them; nothing requires it
#   item_level      every reward's stats are the suffix formula at this item level
#   repeat_chains   true: turning in a chain's last tier restarts it at tier 1
#   givers          one per reward set. `teams` holds one block per team (0 =
#                   Alliance, 1 = Horde), which may override `name`.
#     emotes        Emote ids the giver plays on each screen, 0 = none: offer;
#                   incomplete (talked to before the quest is done); turn_in
#   reward_sets     `animals` names quest keys. `bases` maps slot -> stock item:
#                   stat-blank, no suffix group, InventoryType matching the slot.
#   quests
#     suffix        ItemRandomSuffix id; its stats come from suffix_points.json
#     title         shown as "<title> (<tier>)"
#     objective     `type`, last_hit, collect or volume so far, and `text`, the quest
#                   log's counter label. Collect takes no `text`: the log names the item.
#       targets     last_hit, one list per config. `creeps` names units from
#                   creep_config.yaml, and a last hit on any creep row using one
#                   counts; `neutrals` names mob keys from neutral_config.yaml.
#                   gen_creep_roster.py and gen_neutral_camps.py set each target's
#                   KillCredit1 for the client's tooltip, so re-run them after
#                   changing `targets`.
#       item        collect: a stock item, granted as its +900000 copy. Its
#                   maxcount must be 0 or at least the largest count.
#       from        collect: the creatures that drop `item`, named as `targets`
#                   names them. Each corpse drops one to its killing blow, if that
#                   player holds the quest. gen_creep_roster.py and
#                   gen_neutral_camps.py write these drops, so re-run them after
#                   changing `item` or `from`.
#       feeds       volume: what earns points, every feed on one counter.
#                   damage_dealt: damage to enemy players and creatures, never
#                   structures. healing_done: health restored, on a target in
#                   combat. damage_taken: damage from anyone but yourself.
#                   player_damage: damage to enemy players and what they control.
#                   A damage feed counts the health a hit removed, not the hit.
#       chunk       volume: points per tick of the counter. A finished tier drops
#                   its leftover points.
#     counts        one tier per entry -- a first guess until playtesting
#     dialogue      summary is the "Quest Objectives" paragraph; offer, progress and
#                   complete are the giver's text on each screen. {count} becomes
#                   the tier's count. In game $N is the player's name and $B a line
#                   break. Folded (>-), so wrapping here becomes spaces.

map: 900
quest_sort_id: 5000
quest_level: 40
item_level: 45
repeat_chains: false

# The north and south ends of a five-giver row along the inner face of the
# crescent, 2 yd off the wall, facing the spawn; mail, leather and cloth go between.
givers:
  - key: plate
    reward_set: plate
    name: "Quartermaster"
    subname: "Plate"
    emotes: { offer: 1, incomplete: 274, turn_in: 66 }    # talk, shake head, salute
    teams:
      - { team: 0, display_id: 3275, x: -183.32, y: 7.83, z: 3.0, o: 3.6486 }
      - { team: 1, display_id: 1879, x:  183.16, y: 6.92, z: 3.0, o: 5.8152 }
  - key: jewelry
    reward_set: jewelry
    name: "Jeweler"
    subname: "Jewelry"
    emotes: { offer: 1, incomplete: 274, turn_in: 2 }     # talk, shake head, bow
    teams:
      - { team: 0, display_id: 12669, x: -182.41, y: -7.29, z: 3.0, o: 2.6536 }
      - { team: 1, display_id: 12681, x:  182.84, y: -7.80, z: 3.0, o: 0.4650 }

reward_sets:
  plate:                                     # Embossed Plate
    animals: [tiger, monkey, bear, boar, wolf, owl, whale, falcon]
    bases: { wrist: 9972, hands: 9967, waist: 9968, feet: 9973 }
  jewelry:                                   # Tellurium Necklace, Marsh Ring
    animals: [tiger, monkey, bear, boar, wolf, owl, whale, falcon]
    bases: { neck: 12023, ring: 12012 }

quests:
  - key: tiger
    suffix: 14
    title: "Way of the Tiger"
    objective:
      type: last_hit
      targets:
        creeps: [alliance_footman, horde_grunt, alliance_mage, horde_shaman]
      text: "Minions slain"
    counts: [10, 15, 20, 25]
    dialogue:
      summary: "Land the killing blow on {count} enemy melee or caster minions."
      offer: >-
        The tiger does not waste its strength on the strong, $N. It takes the
        stragglers: the slow, the wounded, the ones already falling.$B$BThe
        enemy's minions march down these lanes by the dozen. Let others wear them
        down; you strike the final blow. Claim {count} of them, and the tiger's
        strength will be yours to wear.
      progress: "The tiger is patient, but it is never idle. Your hunt is not finished."
      complete: "Clean kills, every one. The tiger has marked you, $N.$B$BChoose what you will carry from this hunt."

  - key: monkey
    suffix: 78
    title: "Way of the Monkey"
    objective:
      type: last_hit
      targets:
        neutrals: [wolf_large, wolf_small, wraith_large, wraith_small, golem_large, golem_small]
      text: "Jungle monsters slain"
    counts: [21, 30, 42, 54]
    dialogue:
      summary: "Land the killing blow on {count} worgs, wraiths or golems in the jungle camps."
      offer: >-
        While the lanes grind against each other, the ground between them goes to
        whoever is quick enough to take it, $N. The monkey does not wait on the
        road for its meal. It goes into the trees, takes what it finds, and is gone
        before anyone thinks to look.$B$BWorgs, wraiths and golems fill the camps
        between the lanes, and they return as fast as they are cleared. Strike the
        final blow on {count} of them, and the monkey's quickness will be yours to
        wear.
      progress: "The camps fill again while you stand here, $N. Back into the trees."
      complete: "Quick hands, and never a wasted step. The monkey has marked you, $N.$B$BChoose what you will carry from this hunt."

  - key: bear
    suffix: 68
    title: "Way of the Bear"
    objective:
      type: collect
      item: 44529                              # Demolisher Parts
      from:
        creeps: [alliance_demolisher, horde_demolisher]
    counts: [2, 3, 3, 4]
    dialogue:
      summary: "Land the killing blow on enemy siege minions and salvage {count} Demolisher Parts from the wreckage."
      offer: >-
        The bear does not chase every rabbit, $N. It waits for the prey worth the
        effort, and once its claws are in, it does not let go.$B$BEvery so often
        the enemy sends a demolisher down each lane: slow, armored, and built to
        bring down our towers. Break one, and pull what you can from the wreck.
        Bring me {count} Demolisher Parts, and the bear's endurance will be yours
        to wear.
      progress: "Siege engines are few and far between, $N. Be waiting when the next one comes."
      complete: "Every one of these is a tower the enemy will not take. The bear has marked you, $N.$B$BChoose what you will carry from this hunt."

  - key: boar
    suffix: 12
    title: "Way of the Boar"
    objective:
      type: collect
      item: 17422                              # Armor Scraps
      from:
        creeps: [alliance_footman, horde_grunt, alliance_mage, horde_shaman]
    counts: [10, 15, 20, 25]
    dialogue:
      summary: "Land the killing blow on enemy melee or caster minions and gather {count} Armor Scraps from them."
      offer: >-
        The boar is not clever, $N, and it has never needed to be. It roots
        through the same ground day after day and comes away fed, while cleverer
        beasts go hungry.$B$BThe enemy sends its minions down these lanes in
        armor that will not save them, and each one you finish leaves a little of
        it behind. Gather {count} Armor Scraps from the fallen, and the boar's
        stubbornness will be yours to wear.
      progress: "Not enough yet, $N. The boar keeps digging."
      complete: "A heavy haul, and every scrap of it earned. The boar has marked you, $N.$B$BChoose what you will carry from this hunt."

  - key: wolf
    suffix: 13
    title: "Way of the Wolf"
    objective:
      type: collect
      item: 25812                              # Timber Worg Pelt
      from:
        neutrals: [wolf_large, wolf_small]
    counts: [6, 9, 12, 18]
    dialogue:
      summary: "Land the killing blow on worgs in the jungle camps and take {count} Timber Worg Pelts from them."
      offer: >-
        A lone wolf is a meal for something larger, $N. A wolf that knows its
        ground is what everything else learns to fear.$B$BWorgs den in the jungle
        between the lanes, and they return to their dens as fast as they are
        cleared. Learn where they lie, hunt them each time they come back, and
        bring me {count} of their pelts. Do that, and the wolf's cunning will be
        yours to wear.
      progress: "The worgs will be back in their dens by now, $N. So should you."
      complete: "Thick pelts, cleanly taken. The wolf has marked you, $N.$B$BChoose what you will carry from this hunt."

  - key: owl
    suffix: 9
    title: "Way of the Owl"
    objective:
      type: volume
      feeds: [damage_dealt, healing_done]
      chunk: 1000
      text: "Power unleashed"
    counts: [10, 15, 20, 25]
    dialogue:
      summary: "Damage enemy players, minions and jungle monsters, or heal your allies, until you have unleashed {count} measures of power. Damage to towers, inhibitors and the base does not count."
      offer: >-
        The owl sees the whole field before it moves, $N. It knows where its
        strength is needed, and it spends none of it in the wrong place.$B$BPower
        works the same way. Turn yours on the enemy's champions and minions, or
        pour it into the allies fighting at your side; the owl counts both as
        wisdom put to use. Unleash {count} measures of it, and the owl's wisdom
        will be yours to wear.
      progress: "Power held back is power wasted, $N. Spend more of it."
      complete: "Nothing spent where it was not needed. The owl has marked you, $N.$B$BChoose what you will carry from this hunt."

  - key: whale
    suffix: 81
    title: "Way of the Whale"
    objective:
      type: volume
      feeds: [damage_taken]
      chunk: 600
      text: "Punishment endured"
    counts: [10, 15, 20, 25]
    dialogue:
      summary: "Endure {count} measures of punishment from enemy players, minions, jungle monsters and towers. Harm you do to yourself does not count."
      offer: >-
        The whale is neither quick nor fierce, $N. It dives where nothing else
        can follow, bears the weight of the deep, and always rises again.$B$BIn
        the lanes, every minion, every champion and every tower will try to break
        you. Let them try. Stand where the blows fall, take them, and live to take
        more. Endure {count} measures of their punishment, and the whale's resolve
        will be yours to wear.
      progress: "You are still standing, $N. Then you can stand a little longer."
      complete: "Battered, and still breathing. The whale has marked you, $N.$B$BChoose what you will carry from this hunt."

  - key: falcon
    suffix: 11
    title: "Way of the Falcon"
    objective:
      type: volume
      feeds: [player_damage]
      chunk: 500
      text: "Enemy players harried"
    counts: [10, 15, 20, 25]
    dialogue:
      summary: "Land {count} measures of damage on enemy players and their pets."
      offer: >-
        The falcon is no scavenger, $N. It does not pick at what others have
        killed. It chooses living prey, the swiftest in the sky, and takes it on
        the wing.$B$BThe minions are fodder; let others squabble over them. The
        champions the enemy sends against us are the prey worth hunting. Find
        them in the lanes, strike them, and keep striking. Land {count} measures
        of damage on the enemy's champions, and the falcon's precision will be
        yours to wear.
      progress: "Your prey is still out there, $N. Hunt it."
      complete: "Swift prey, cleanly struck. The falcon has marked you, $N.$B$BChoose what you will carry from this hunt."
