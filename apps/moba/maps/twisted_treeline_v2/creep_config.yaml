# Lane creeps for Twisted Treeline. All creeps inherit the top-level `map` and
# spawn only there. Team 0 walks its slot's forward path, team 1 the reverse --
# and both lanes run west -> east, so Alliance (west) walks forward.
# Field reference (units/ranges) lives in apps/moba/README.md; legend below is
# the quick version.
#
#   units           reusable definitions of what a creep IS. A creep row names
#                   one with `unit:` and may override any field it sets --
#                   wholesale per field, never merged (a row restating `drops`
#                   replaces the list; `drops: []` means none). A unit may not
#                   set `key`, `lane`, or `slot`: those place a creep.
#   team            0 = Alliance, 1 = Horde
#   role            melee | caster | siege | super  (caster needs the attack_* fields)
#   source          creature_template entry id this copies stats from. Pinned by
#                   digest in the lockfile -- an upstream retune fails the run
#                   until you re-run with --rebless-sources.
#   lane / slot     must already exist in lane_config.lock.json; unique per team
#   rank            optional; overrides source rank (siege uses 1 = elite).
#                   Elite compounds with the *_modifier values -- the engine
#                   folds rank into health AND damage on top of them.
#   creature_type   optional; overrides source type (enum CreatureType).
#                   Mechanical (9) creatures are immune to direct heals.
#   speed_walk      optional; overrides source speed (multiplier, 1.0 = baseline).
#   speed_run       Lane paths use move_type RUN, so speed_run is what holds
#                   formation -- mismatched sources drift apart.
#   aggro_range     optional; yards, same meaning as in neutral_config.yaml. The
#                   engine floors it at 5 and scales by Rate.Creature.Aggro;
#                   0 disables proximity aggro, so the creep only fights back.
#   swing_time_ms   optional; melee swing timer. NOT the caster cast cadence --
#                   that is attack_interval_ms.
#   *_modifier      multiplier on the source creature's stat (0.15 = 15%)
#   attack_range    yards; caster-only
#   attack_*_ms     milliseconds
#   despawn_ms      corpse despawn after death
#   drops[].chance  optional, (0, 1], default 1.0; rolled per kill
#
# One creep row = one unit per wave PER LANE. Ten rows per team here: five slots
# on each of two lanes.

